
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GroqChat AI Assistant</title>

<style>
:root {
  --bg:#0d0d14;
  --panel:#151520;
  --panel2:#1d1d2b;
  --text:#f4f3fb;
  --muted:#9b99ad;
  --line:#2b2a3b;
  --accent:#9b7bff;
  --user:#292342;
  --shadow:0 18px 55px #0005;
}

body.light {
  color-scheme:light;
  --bg:#f5f5fa;
  --panel:#fff;
  --panel2:#efeff6;
  --text:#1c1b27;
  --muted:#707084;
  --line:#e0dfeb;
  --user:#eee9ff;
  --shadow:0 15px 40px #24204412;
}

* {box-sizing:border-box}

body {
  margin:0;
  height:100vh;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font:15px/1.55 Inter,system-ui,Arial,sans-serif;
}

button,input,textarea,select {font:inherit}
button {cursor:pointer}

.app {display:flex;height:100vh}

.sidebar {
  width:270px;
  flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:17px;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:19px;
}

.logo {
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,#b08cff,#6548d9);
  display:grid;
  place-items:center;
  color:white;
  font-size:21px;
}

.new-chat,.side-button {
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  text-align:left;
}

.new-chat:hover,.side-button:hover,.icon-btn:hover {
  border-color:var(--accent);
}

.section-label {
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
}

.history {overflow:auto;flex:1}

.history-item {
  padding:9px 10px;
  border-radius:9px;
  color:var(--muted);
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
  margin-top:4px;
}

.history-item:hover,.history-item.active {
  background:var(--panel2);
  color:var(--text);
}

.side-bottom {
  border-top:1px solid var(--line);
  padding-top:13px;
  display:grid;
  gap:9px;
}

.main {
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
}

.topbar {
  height:68px;
  flex-shrink:0;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  gap:12px;
}

.top-left,.top-actions {
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.model-select {
  max-width:270px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
  padding:9px 11px;
  border-radius:10px;
  outline:none;
}

.icon-btn {
  width:39px;
  height:39px;
  border-radius:11px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
}

.status {
  font-size:12px;
  color:var(--muted);
}

.chat-area {
  flex:1;
  overflow-y:auto;
  padding:28px 18px;
}

.messages {
  max-width:850px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:23px;
}

.welcome {
  text-align:center;
  margin:auto;
  padding:65px 12px 35px;
}

.welcome-icon {
  width:66px;
  height:66px;
  margin:0 auto 17px;
  border-radius:21px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#a887ff,#5941c9);
  font-size:31px;
}

.welcome h1 {
  font-size:29px;
  margin:0 0 8px;
}

.welcome p {color:var(--muted)}

.suggestions {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
  margin-top:23px;
}

.suggestion {
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:12px;
  padding:10px 13px;
  font-size:13px;
}

.suggestion:hover {border-color:var(--accent)}

.message {
  display:flex;
  align-items:flex-start;
  gap:12px;
}

.avatar {
  width:34px;
  height:34px;
  flex-shrink:0;
  border-radius:11px;
  background:var(--panel2);
  display:grid;
  place-items:center;
}

.message.user .avatar {
  background:#51409a;
  color:white;
}

.message-content {
  flex:1;
  min-width:0;
}

.message-name {
  font-size:12px;
  color:var(--muted);
  margin:1px 0 7px;
}

.message-text {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  line-height:1.8;
}

.message-actions {
  display:flex;
  gap:10px;
  margin-top:8px;
}

.message-actions button {
  border:0;
  background:none;
  color:var(--muted);
  font-size:12px;
  padding:3px;
}

.message-actions button:hover {color:var(--text)}

.composer-wrap {padding:12px 18px 18px}

.composer {max-width:850px;margin:auto}

.input-box {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  padding:12px 13px;
  box-shadow:var(--shadow);
}

.input-box:focus-within {border-color:var(--accent)}

#prompt {
  display:block;
  width:100%;
  min-height:35px;
  max-height:180px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:5px;
  font-size:15px;
  line-height:1.6;
}

.input-bottom {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.hint,.disclaimer {
  font-size:11px;
  color:var(--muted);
}

.send-btn {
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:white;
  font-size:19px;
}

.send-btn:disabled {opacity:.5;cursor:not-allowed}

.disclaimer {
  text-align:center;
  margin-top:9px;
}

.modal-backdrop {
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:10;
}

.modal-backdrop.open {display:flex}

.modal {
  width:min(480px,100%);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow:var(--shadow);
}

.modal h2 {margin:0 0 6px;font-size:20px}

.modal p {
  color:var(--muted);
  font-size:13px;
  margin:0 0 16px;
}

.field-label {
  display:block;
  font-size:13px;
  margin:13px 0 6px;
}

.field {
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  background:var(--panel2);
  color:var(--text);
  outline:none;
}

.field:focus {border-color:var(--accent)}

.modal-actions {
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:17px;
}

.primary,.secondary {
  border:0;
  border-radius:10px;
  padding:10px 14px;
}

.primary {
  background:var(--accent);
  color:white;
}

.secondary {
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--line);
}

.key-state {
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}

.toast {
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:var(--panel2);
  border:1px solid var(--line);
  padding:10px 15px;
  border-radius:10px;
  display:none;
  z-index:20;
}

.toast.show {display:block}
.mobile-menu {display:none}

@media(max-width:720px) {
  .sidebar {
    position:fixed;
    z-index:5;
    top:0;
    bottom:0;
    left:-280px;
    transition:.22s;
    box-shadow:var(--shadow);
  }

  .sidebar.open {left:0}
  .mobile-menu {display:inline-block}
  .topbar {height:62px;padding:0 10px}
  .chat-area {padding:18px 11px}
  .composer-wrap {padding:8px 10px 12px}
  .model-select {
    max-width:190px;
    font-size:12px;
    padding:8px 5px;
  }
  .status {display:none}
  .welcome {padding-top:48px}
  .welcome h1 {font-size:24px}
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">✦</div>
      GroqChat
    </div>

    <button class="new-chat" id="newChat">
      ＋ New chat
    </button>

    <div class="section-label">Chat history</div>

    <div class="history" id="history"></div>

    <div class="side-bottom">
      <button class="side-button" id="settingsBtn">
        ⚙ API Key Settings
      </button>

      <div class="section-label">
        Powered by Groq API
      </div>
    </div>

  </aside>

  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button class="icon-btn mobile-menu" id="menuBtn">
          ☰
        </button>

        <select class="model-select" id="modelSelect">

          <optgroup label="GPT OSS">
            <option value="openai/gpt-oss-120b">
              GPT OSS 120B
            </option>

            <option value="openai/gpt-oss-20b">
              GPT OSS 20B
            </option>
          </optgroup>

          <optgroup label="Llama">
            <option value="llama-3.3-70b-versatile">
              Llama 3.3 70B
            </option>

            <option value="llama-3.1-8b-instant">
              Llama 3.1 8B Instant
            </option>
          </optgroup>

        </select>

        <span class="status" id="status">
          ● Ready
        </span>

      </div>

      <div class="top-actions">

        <button class="icon-btn" id="themeBtn" title="Toggle theme">
          ☼
        </button>

        <button class="icon-btn" id="topSettings" title="API settings">
          ⚙
        </button>

      </div>

    </header>

    <section class="chat-area" id="chatArea">
      <div class="messages" id="messages"></div>
    </section>

    <footer class="composer-wrap">

      <div class="composer">

        <div class="input-box">

          <textarea
            id="prompt"
            rows="1"
            placeholder="Message GroqChat..."
          ></textarea>

          <div class="input-bottom">

            <span class="hint">
              Enter to send · Shift + Enter for new line
            </span>

            <button class="send-btn" id="sendBtn">
              ➤
            </button>

          </div>

        </div>

        <div class="disclaimer">
          AI can make mistakes. Check important information.
        </div>

      </div>

    </footer>

  </main>

</div>

<!-- API KEY SETTINGS -->

<div class="modal-backdrop" id="settingsModal">

  <div class="modal">

    <h2>Groq API Key</h2>

    <p>
      Enter your Groq API key below.
      It is stored only in this browser tab's session storage.
    </p>

    <label class="field-label" for="apiKeyInput">
      API Key
    </label>

    <input
      class="field"
      id="apiKeyInput"
      type="password"
      placeholder="gsk_..."
      autocomplete="off"
    >

    <div class="key-state" id="keyState">
      No API key added.
    </div>

    <label style="display:flex;gap:8px;margin-top:14px;font-size:13px">
      <input type="checkbox" id="showKey">
      Show API key
    </label>

    <div class="modal-actions">

      <button class="secondary" id="clearKey">
        Remove key
      </button>

      <button class="secondary" id="closeSettings">
        Cancel
      </button>

      <button class="primary" id="saveKey">
        Save key
      </button>

    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

"use strict";

const GROQ_URL =
"https://api.groq.com/openai/v1/chat/completions";

const SYSTEM_PROMPT = `
You are a helpful, accurate, friendly AI assistant.

Language rules:
1. Reply in the same language as the user's latest message.
2. If the user writes Hindi or Hinglish, reply in clear Hindi.
3. If the user writes English, reply in English.
4. Provide complete runnable code when requested.
5. Do not use Spanish unless explicitly requested.
6. Explain things clearly and helpfully.
`;

const $ = id => document.getElementById(id);

let chats = [];

try {
  chats = JSON.parse(
    localStorage.getItem("groqchat_chats") || "[]"
  );

  if (!Array.isArray(chats)) chats = [];

} catch {
  chats = [];
}

let currentChatId = null;
let busy = false;


// API KEY

function getKey() {
  return sessionStorage.getItem("groqchat_api_key") || "";
}


// STORAGE

function saveChats() {
  localStorage.setItem(
    "groqchat_chats",
    JSON.stringify(chats)
  );
}

function currentChat() {
  return chats.find(c => c.id === currentChatId);
}


// TOAST

function toast(msg) {

  const el = $("toast");

  el.textContent = msg;
  el.classList.add("show");

  setTimeout(() => {
    el.classList.remove("show");
  }, 2400);

}


// SCROLL

function scrollBottom() {

  $("chatArea").scrollTop =
    $("chatArea").scrollHeight;

}


// CREATE CHAT

function createChat() {

  const chat = {
    id: crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()),

    title: "New chat",
    messages: [],
    updatedAt: Date.now()
  };

  chats.unshift(chat);

  currentChatId = chat.id;

  saveChats();
  renderHistory();
  renderMessages();

  $("sidebar").classList.remove("open");
  $("prompt").focus();

}


// CHAT HISTORY

function renderHistory() {

  const root = $("history");

  root.replaceChildren();

  chats.forEach(chat => {

    const item = document.createElement("div");

    item.className =
      "history-item" +
      (chat.id === currentChatId ? " active" : "");

    item.textContent = chat.title;
    item.title = chat.title;

    item.addEventListener("click", () => {

      currentChatId = chat.id;

      renderHistory();
      renderMessages();

      $("sidebar").classList.remove("open");

    });

    root.appendChild(item);

  });

}


// ADD MESSAGE

function addMessage(role, content, actions = true) {

  const wrap = document.createElement("div");

  wrap.className = "message " + role;

  const avatar = document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    role === "user" ? "👤" : "✦";

  const body = document.createElement("div");

  body.className = "message-content";

  const name = document.createElement("div");

  name.className = "message-name";

  name.textContent =
    role === "user" ? "You" : "GroqChat";

  const text = document.createElement("div");

  text.className = "message-text";

  text.textContent = content;

  body.append(name, text);

  if (role === "assistant" && actions) {

    const bar = document.createElement("div");

    bar.className = "message-actions";

    const copy = document.createElement("button");

    copy.textContent = "Copy";

    copy.onclick = () => copyText(content);

    const regen = document.createElement("button");

    regen.textContent = "Regenerate";

    regen.onclick = regenerate;

    bar.append(copy, regen);

    body.append(bar);

  }

  wrap.append(avatar, body);

  $("messages").append(wrap);

  return text;

}


// RENDER CHAT

function renderMessages() {

  const root = $("messages");

  root.replaceChildren();

  const chat = currentChat();

  if (!chat || !chat.messages.length) {

    const welcome = document.createElement("div");

    welcome.className = "welcome";

    welcome.innerHTML = `
      <div class="welcome-icon">✦</div>

      <h1>What can I help with?</h1>

      <p>
        Chat with GPT OSS or Llama using Groq API.
      </p>

      <div class="suggestions">

        <button class="suggestion">
          Explain JavaScript closures
        </button>

        <button class="suggestion">
          Build a responsive website
        </button>

        <button class="suggestion">
          Give me a business idea
        </button>

      </div>
    `;

    root.append(welcome);

    welcome.querySelectorAll(".suggestion").forEach(btn => {

      btn.onclick = () => {

        $("prompt").value = btn.textContent;

        sendMessage();

      };

    });

  } else {

    chat.messages.forEach(m => {
      addMessage(m.role, m.content);
    });

  }

  scrollBottom();

}


// COPY

async function copyText(text) {

  try {

    await navigator.clipboard.writeText(text);

    toast("Copied!");

  } catch {

    const temp = document.createElement("textarea");

    temp.value = text;

    document.body.append(temp);

    temp.select();

    document.execCommand("copy");

    temp.remove();

    toast("Copied!");

  }

}


// SETTINGS

function openSettings() {

  $("apiKeyInput").value = getKey();

  $("apiKeyInput").type =
    $("showKey").checked ? "text" : "password";

  $("keyState").textContent =
    getKey()
      ? "API key is saved for this tab."
      : "No API key added.";

  $("settingsModal").classList.add("open");

  $("apiKeyInput").focus();

}

function closeSettings() {

  $("settingsModal").classList.remove("open");

}

$("settingsBtn").onclick = openSettings;

$("topSettings").onclick = openSettings;

$("closeSettings").onclick = closeSettings;

$("settingsModal").addEventListener("click", e => {

  if (e.target === $("settingsModal")) {
    closeSettings();
  }

});

$("showKey").onchange = () => {

  $("apiKeyInput").type =
    $("showKey").checked ? "text" : "password";

};

$("saveKey").onclick = () => {

  const key = $("apiKeyInput").value.trim();

  if (!key) {
    toast("Paste your Groq API key first.");
    return;
  }

  if (!/^gsk_[A-Za-z0-9_-]+$/.test(key)) {
    toast("Invalid Groq API key format.");
    return;
  }

  sessionStorage.setItem(
    "groqchat_api_key",
    key
  );

  $("keyState").textContent =
    "API key saved for this tab.";

  closeSettings();

  toast("API key saved.");

};

$("clearKey").onclick = () => {

  sessionStorage.removeItem("groqchat_api_key");

  $("apiKeyInput").value = "";

  $("keyState").textContent = "API key removed.";

  toast("API key removed.");

};


// SEND MESSAGE

async function sendMessage() {

  if (busy) return;

  const text = $("prompt").value.trim();

  if (!text) return;

  if (!getKey()) {

    openSettings();

    toast("Add your Groq API key first.");

    return;

  }

  if (!currentChatId) createChat();

  const chat = currentChat();

  chat.messages.push({
    role: "user",
    content: text
  });

  if (
    chat.messages.filter(m => m.role === "user").length === 1
  ) {

    chat.title =
      text.slice(0, 38) +
      (text.length > 38 ? "..." : "");

  }

  $("prompt").value = "";

  $("prompt").style.height = "auto";

  saveChats();

  renderHistory();

  renderMessages();

  await callGroq();

}


// GROQ API REQUEST

async function callGroq() {

  const chat = currentChat();

  if (!chat || busy) return;

  busy = true;

  $("sendBtn").disabled = true;

  $("status").textContent = "● Thinking...";

  const loading = addMessage(
    "assistant",
    "Thinking...",
    false
  );

  try {

    const response = await fetch(GROQ_URL, {

      method: "POST",

      headers: {
        "Authorization": "Bearer " + getKey(),
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        model: $("modelSelect").value,

        messages: [

          {
            role: "system",
            content: SYSTEM_PROMPT
          },

          ...chat.messages.slice(-24).map(m => ({
            role: m.role,
            content: m.content
          }))

        ],

        temperature: 0.7,

        max_completion_tokens: 4096

      })

    });

    const data = await response.json();

    if (!response.ok) {

      throw new Error(
        data?.error?.message ||
        `Groq API error: ${response.status}`
      );

    }

    const answer =
      data?.choices?.[0]?.message?.content;

    if (!answer || !answer.trim()) {

      throw new Error("Empty response from model.");

    }

    chat.messages.push({
      role: "assistant",
      content: answer.trim()
    });

    loading.textContent = answer.trim();

    const actions = document.createElement("div");

    actions.className = "message-actions";

    const copy = document.createElement("button");

    copy.textContent = "Copy";

    copy.onclick = () => copyText(answer.trim());

    const regen = document.createElement("button");

    regen.textContent = "Regenerate";

    regen.onclick = regenerate;

    actions.append(copy, regen);

    loading.parentElement.append(actions);

  } catch (error) {

    const message =
      error instanceof TypeError
        ? "Network/CORS error. Check internet connection or use a backend proxy."
        : error.message;

    loading.textContent = "Error: " + message;

    toast("Could not get a response.");

  } finally {

    busy = false;

    $("sendBtn").disabled = false;

    $("status").textContent = "● Ready";

    chat.updatedAt = Date.now();

    saveChats();

    renderHistory();

    scrollBottom();

  }

}


// REGENERATE

async function regenerate() {

  if (busy) return;

  const chat = currentChat();

  if (!chat || !chat.messages.length) return;

  if (chat.messages.at(-1).role === "assistant") {
    chat.messages.pop();
  }

  if (
    !chat.messages.length ||
    chat.messages.at(-1).role !== "user"
  ) {
    toast("No user message available.");
    return;
  }

  if (!getKey()) {
    openSettings();
    return;
  }

  renderMessages();

  await callGroq();

}


// BUTTON EVENTS

$("sendBtn").onclick = sendMessage;

$("newChat").onclick = createChat;

$("prompt").addEventListener("keydown", e => {

  if (e.key === "Enter" && !e.shiftKey) {

    e.preventDefault();

    sendMessage();

  }

});

$("prompt").addEventListener("input", () => {

  $("prompt").style.height = "auto";

  $("prompt").style.height =
    Math.min($("prompt").scrollHeight, 180) + "px";

});


// THEME

$("themeBtn").onclick = () => {

  document.body.classList.toggle("light");

  localStorage.setItem(
    "groqchat_theme",
    document.body.classList.contains("light")
      ? "light"
      : "dark"
  );

};


// MOBILE MENU

$("menuBtn").onclick = () => {

  $("sidebar").classList.toggle("open");

};


// INITIALIZE

function init() {

  if (
    localStorage.getItem("groqchat_theme") === "light"
  ) {
    document.body.classList.add("light");
  }

  if (chats.length) {

    currentChatId = chats[0].id;

  } else {

    createChat();

  }

  renderHistory();

  renderMessages();

  if (!getKey()) {

    setTimeout(openSettings, 350);

  }

}

init();

</script>

</body>
</html>
